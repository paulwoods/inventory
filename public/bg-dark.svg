<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
    <!-- Dark mode, subtle, repeatable background pattern themed to Inventory app -->
    <defs>
        <!-- Colors tuned to app theme: fg=#e6eef8, accent=#6aa9ff on bg=#0b1020 -->
        <linearGradient id="gline" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6aa9ff" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#e6eef8" stop-opacity="0.04"/>
        </linearGradient>

        <!-- Icons as symbols: home (Homes), pin (Locations), box (Items), gear (Equipment), doc (Procedures), wrench (Services/Work) -->
        <symbol id="ic-home" viewBox="0 0 24 24">
            <path d="M4 11l8-6 8 6" fill="none" stroke="#e6eef8" stroke-width="1.4" stroke-opacity="0.07"/>
            <path d="M6 10v8h12v-8" fill="none" stroke="#e6eef8" stroke-width="1.2" stroke-opacity="0.07"/>
        </symbol>
        <symbol id="ic-pin" viewBox="0 0 24 24">
            <path d="M12 22s6-7.2 6-12a6 6 0 10-12 0c0 4.8 6 12 6 12z" fill="none" stroke="#e6eef8" stroke-width="1.2"
                  stroke-opacity="0.06"/>
            <circle cx="12" cy="10" r="2" fill="#6aa9ff" fill-opacity="0.08"/>
        </symbol>
        <symbol id="ic-box" viewBox="0 0 24 24">
            <path d="M3 7l9-4 9 4-9 4-9-4z" fill="none" stroke="#e6eef8" stroke-width="1.2" stroke-opacity="0.06"/>
            <path d="M12 11v10M3 7v10l9 4 9-4V7" fill="none" stroke="#e6eef8" stroke-width="1.1" stroke-opacity="0.05"/>
        </symbol>
        <symbol id="ic-gear" viewBox="0 0 24 24">
            <path d="M12 8a4 4 0 110 8 4 4 0 010-8z" fill="none" stroke="#e6eef8" stroke-width="1.1"
                  stroke-opacity="0.06"/>
            <path d="M4 12h2M18 12h2M12 4v2M12 18v2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6" fill="none"
                  stroke="#e6eef8" stroke-width="1" stroke-opacity="0.05"/>
        </symbol>
        <symbol id="ic-doc" viewBox="0 0 24 24">
            <path d="M6 3h9l3 3v15H6z" fill="none" stroke="#e6eef8" stroke-width="1.1" stroke-opacity="0.06"/>
            <path d="M9 9h6M9 12h6M9 15h6" fill="none" stroke="#6aa9ff" stroke-width="1" stroke-opacity="0.08"/>
        </symbol>
        <symbol id="ic-wrench" viewBox="0 0 24 24">
            <path d="M21 7a6 6 0 01-8.5 5.5L6 19l-3-3 6.5-6.5A6 6 0 1121 7z" fill="none" stroke="#e6eef8"
                  stroke-width="1.1" stroke-opacity="0.06"/>
            <circle cx="18" cy="6" r="1.2" fill="#6aa9ff" fill-opacity="0.1"/>
        </symbol>

        <!-- Dotted grid pattern for subtle texture -->
        <pattern id="grid" patternUnits="userSpaceOnUse" width="16" height="16">
            <circle cx="1" cy="1" r="1" fill="#e6eef8" fill-opacity="0.03"/>
        </pattern>
    </defs>

    <!-- Background tile -->
    <rect width="256" height="256" fill="url(#grid)"/>

    <!-- Diagonal accent lines -->
    <path d="M-10 220 L 220 -10" stroke="url(#gline)" stroke-width="0.8"/>
    <path d="M36 266 L 266 36" stroke="url(#gline)" stroke-width="0.6"/>

    <!-- Scatter thematic icons at low opacity; placement chosen to tile nicely -->
    <g opacity="1">
        <use href="#ic-home" x="20" y="20" width="24" height="24"/>
        <use href="#ic-pin" x="92" y="18" width="22" height="22"/>
        <use href="#ic-box" x="160" y="16" width="24" height="24"/>

        <use href="#ic-gear" x="28" y="100" width="22" height="22"/>
        <use href="#ic-doc" x="98" y="96" width="22" height="22"/>
        <use href="#ic-wrench" x="172" y="92" width="24" height="24"/>

        <use href="#ic-pin" x="12" y="176" width="22" height="22"/>
        <use href="#ic-home" x="84" y="172" width="24" height="24"/>
        <use href="#ic-box" x="156" y="172" width="24" height="24"/>
    </g>

    <!-- Soft vignetting so seams are less visible when tiled -->
    <radialGradient id="vign" cx="50%" cy="50%" r="70%">
        <stop offset="60%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
    </radialGradient>
    <rect width="256" height="256" fill="url(#vign)"/>
</svg>
