<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Inventory app icon: stacked box glyph with accent check, tuned for dark backgrounds -->
    <defs>
        <!-- Match app palette -->
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e6eef8"/>
            <stop offset="1" stop-color="#cdd8e6"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="0.6" flood-color="#6aa9ff" flood-opacity="0.45"/>
        </filter>
    </defs>

    <!-- Outer rounded container (represents a shelf/space) -->
    <rect x="6" y="6" width="52" height="52" rx="12" ry="12" fill="none" stroke="url(#g)" stroke-width="2.5"/>

    <!-- Stacked boxes (inventory) -->
    <g fill="none" stroke="#e6eef8" stroke-opacity="0.9" stroke-width="2">
        <!-- Top box -->
        <path d="M22 18h12l6 6v12H22z" opacity="0.95"/>
        <path d="M34 18v6h6" opacity="0.9"/>

        <!-- Bottom box (wider) -->
        <path d="M18 36h28v12H18z" opacity="0.85"/>
        <path d="M32 36v12" opacity="0.85"/>
    </g>

    <!-- Accent checkmark (stock verified / service done) -->
    <path d="M26 42l4 4 10-10" fill="none" stroke="#6aa9ff" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Small dot detail -->
    <circle cx="26" cy="24" r="1.6" fill="#6aa9ff"/>
</svg>